<style>

  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ fontsReady=true; maybeBoot(); }); }
  else { fontsReady=true; }

  var booted=false;
  function maybeBoot(){
    if(booted || !logoReady || !fontsReady) return;
    booted=true;
    makeSprites(); rebuild();
    if(!reduce) start();
  }

  function rand(a,b){ return a+Math.random()*(b-a); }
  function newCanvas(s){ var c=document.createElement('canvas'); c.width=s; c.height=s; return c; }

  function drawIA(c, col){
    var s=c.canvas.width; c.clearRect(0,0,s,s);
    c.fillStyle=col; c.textAlign='center'; c.textBaseline='middle';
    c.font='700 '+Math.round(s*0.52)+'px "DM Sans", Arial, sans-serif';
    c.fillText('IA', s*0.5, s*0.56);
  }
  function drawHuman(c, col){
    var s=c.canvas.width; c.clearRect(0,0,s,s); c.fillStyle=col;
    c.beginPath(); c.arc(s*0.5, s*0.30, s*0.16, 0, 7); c.fill();
    c.beginPath(); c.moveTo(s*0.22, s*0.84);
    c.quadraticCurveTo(s*0.50, s*0.40, s*0.78, s*0.84); c.closePath(); c.fill();
  }
  function makeSprites(){
    sprIA=newCanvas(56); drawIA(sprIA.getContext('2d'), IA_COL);
    sprH =newCanvas(56); drawHuman(sprH.getContext('2d'), HUM_COL);
  }

  function buildBig(){
    if(!logoReady){ big=null; mask=null; return; }
    big=document.createElement('canvas'); big.width=W; big.height=H;
    var bx=big.getContext('2d');
    var box=Math.min(W*0.46, H*0.48), iw=logo.width, ih=logo.height, sc=box/Math.max(iw,ih);
    var dw=iw*sc, dh=ih*sc, dx=(W-dw)/2, dy=H*0.40-dh/2;
    bx.drawImage(logo,dx,dy,dw,dh);
    var d=bx.getImageData(0,0,W,H).data;
    mask=new Uint8Array(W*H);
    for(var i=0,j=0;i<mask.length;i++,j+=4) mask[i]=d[j+3]>50?1:0;
  }
  function inMask(x,y){ if(!mask) return false; var xi=x|0,yi=y|0; if(xi<0||yi<0||xi>=W||yi>=H) return false; return mask[yi*W+xi]===1; }

  function spawn(p){
    p=p||{}; p.x=rand(0,W); p.y=rand(0,H);
    p.spd=rand(0.35,0.9); p.size=rand(14,24); p.life=rand(140,460);
    p.spr = Math.random()<0.5 ? sprIA : sprH;
    return p;
  }
  function init(){ var n=Math.round(Math.min((W*H)/6000, 440)); if(W<620)n=Math.round(n*0.7); particles=[]; for(var i=0;i<n;i++) particles.push(spawn()); }
  function flowField(x,y,t){ return (Math.sin(x*0.0016+t*0.6)+Math.cos(y*0.0018-t*0.5)+Math.sin((x+y)*0.0012+t*0.3))*Math.PI; }
  function stamp(cx,p){ var w=p.size; cx.drawImage(p.spr, p.x-w/2, p.y-w/2, w, w); }

  function move(t, ambient){
    for(var i=0;i<particles.length;i++){
      var p=particles[i], a=flowField(p.x,p.y,t);
      p.x+=Math.cos(a)*p.spd; p.y+=Math.sin(a)*p.spd; p.life--;
      if(ambient){ fx.globalAlpha=0.05; stamp(fx,p); }
      if(inMask(p.x,p.y)){ gx.globalAlpha=0.55; stamp(gx,p); }
      if(p.life<0||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) spawn(p);
    }
    fx.globalAlpha=1; gx.globalAlpha=1;
  }
  function clipReveal(){ if(!big) return; gx.globalCompositeOperation='destination-in'; gx.drawImage(big,0,0); gx.globalCompositeOperation='source-over'; }

  function frame(now){
    var t=now*0.00016;
    fx.globalCompositeOperation='source-over'; fx.fillStyle='rgba(15,14,12,0.09)'; fx.fillRect(0,0,W,H);
    gx.globalCompositeOperation='destination-out'; gx.fillStyle='rgba(0,0,0,0.010)'; gx.fillRect(0,0,W,H);
    gx.globalCompositeOperation='source-over';
    move(t, true); clipReveal();
    raf=requestAnimationFrame(frame);
  }
  function warmup(n){ gx.globalCompositeOperation='source-over'; for(var s=0;s<n;s++) move(s*0.02, false); clipReveal(); }

  function paintBase(){ fx.globalCompositeOperation='source-over'; fx.fillStyle='#0F0E0C'; fx.fillRect(0,0,W,H); gx.globalCompositeOperation='source-over'; gx.clearRect(0,0,W,H); }
  function sizeC(c,cx){ c.width=W*DPR; c.height=H*DPR; c.style.width=W+'px'; c.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); }
  function rebuild(){
    DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
    sizeC(flow,fx); sizeC(glyph,gx);
    paintBase(); init(); buildBig(); if(mask) warmup(reduce?360:300);
  }
  function start(){ if(!raf && !reduce) raf=requestAnimationFrame(frame); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ if(!booted) return; stop(); rebuild(); start(); },160); });
  document.addEventListener('visibilitychange', function(){ if(!booted) return; document.hidden?stop():start(); });
})();
